name: B1-01 isolated Python contracts
on:
  push:
    branches:
      - feat/v32-b1-01-anniversary-anchor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: B1-01 migration and merge safety
        run: python -m unittest discover -s tests -p 'test_anniversary_anchor_migration.py' -v
      - name: Existing contract regression
        run: python -m unittest discover -s tests -p 'test_contracts.py' -v
