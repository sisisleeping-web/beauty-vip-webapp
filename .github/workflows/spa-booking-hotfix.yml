name: SPA booking hotfix regression
on:
  push:
    branches:
      - fix/admin-booking-add-failure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 與 PythonAnywhere 正式環境相同的 Python 版本
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - name: Full unittest suite (booking, migration, lock, contracts)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
